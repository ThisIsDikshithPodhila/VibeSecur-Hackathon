# OpenShell gateway TOML configuration — Docker compute driver.
#
# This file is the primary configuration source for docker-compose.yml in this
# directory.  It is mounted read-only at /etc/openshell/gateway.toml inside the
# gateway container and loaded via OPENSHELL_GATEWAY_CONFIG.
#
# Why docker-compose.yml sets command: []:
#   The gateway image's default CMD passes --bind-address 0.0.0.0 --port 8080
#   as explicit CLI flags.  CLI flags beat the TOML file in the merge order, so
#   bind_address = "127.0.0.1:8080" below would be silently ignored without
#   clearing the CMD first.
#
# grpc_endpoint note:
#   host.docker.internal is automatically resolvable from containers on
#   Docker Desktop (Windows / macOS).  On Linux, add extra_hosts to the
#   gateway service:
#     extra_hosts:
#       - "host.docker.internal:host-gateway"
#       - "host.openshell.internal:host-gateway"

[openshell]
version = 1

[openshell.gateway]
# Bind to loopback only.  The Docker driver adds an extra listener on the
# bridge interface automatically so sandbox containers can reach the gateway.
bind_address        = "0.0.0.0:8080"
# Docker's host port is loopback-only; bind the container interface so its
# published health port actually reaches this listener.
health_bind_address = "0.0.0.0:8081"
log_level           = "info"
compute_drivers     = ["docker"]
disable_tls         = false

[openshell.gateway.tls]
cert_path = "/var/lib/openshell/tls/server/tls.crt"
key_path = "/var/lib/openshell/tls/server/tls.key"
client_ca_path = "/var/lib/openshell/tls/ca.crt"
require_client_auth = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path = "/var/lib/openshell/tls/jwt/public.pem"
kid_path = "/var/lib/openshell/tls/jwt/kid"
gateway_id = "vibesecur"
ttl_secs = 3600

[openshell.gateway.mtls_auth]
enabled = true

[openshell.drivers.docker]
# Employee conversations attach only a separately created, labeled Docker
# named volume. OpenShell's resource admission validates its operator label;
# host bind mounts remain disabled. The trusted adapter also checks the exact
# volume name, labels, Docker mount, and per-conversation identity each turn.
allow_driver_config = true
enable_bind_mounts = false

# This bridge is provisioned with --internal before gateway startup. OpenShell
# 0.0.116 accepts an existing bridge by name; allowing it to create a missing
# bridge would silently create a non-internal network.
network_name      = "vibesecur-worker-internal"
# Default image pulled for `openshell sandbox create` without --from.
default_image     = "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
# Supervisor image from which the openshell-sandbox binary is extracted on
# first start.  The binary is cached to XDG_DATA_HOME and reused on restart.
supervisor_image  = "ghcr.io/nvidia/openshell/supervisor:0.0.116@sha256:c8c42aef16c200063e32cbf72e553e4ead027085427b555efafd95063ecead42"
# Only pull images that are not already cached locally.
image_pull_policy = "IfNotPresent"
# Prefix applied to sandbox container names.
sandbox_namespace = "openshell"
# Address sandbox containers use to call back to the gateway.
# The Docker driver replaces the host with host.openshell.internal and the
# port with the gateway's own bind port (8080).  Only the scheme survives.
# The gateway must be published on port 8080 on the Docker host so that
# host.openshell.internal:8080 resolves to the gateway container.
grpc_endpoint     = "https://host.openshell.internal:8080"
guest_tls_ca      = "/var/lib/openshell/tls/ca.crt"
guest_tls_cert    = "/var/lib/openshell/tls/client/tls.crt"
guest_tls_key     = "/var/lib/openshell/tls/client/tls.key"

[openshell.drivers.docker.resource_admission]
enabled = true

[openshell.drivers.docker.resource_admission.required_labels]
"openshell.ai/sandbox-attachable" = "true"
"openshell.ai/sandbox-attachable-workspace" = "default"
