version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /opt, /app, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  read_only_probe:
    name: read-only-probe
    endpoints:
      - host: vibesecur-demo-20260925.centralindia.cloudapp.azure.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - {path: /usr/bin/curl}
  model_broker_probe:
    name: model-broker-only
    endpoints:
      - host: host.openshell.internal
        port: 8000
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /model/v1/chat/completions}
    binaries:
      - {path: /usr/bin/curl}
      - {path: /usr/local/bin/python}
